<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Combined CSS Effects</h1><p>Hover, focus, and click to try each example.</p></header>
    <main class="effects">
        <article class="effect-card"><span class="symbol">✦</span><h2>Explore</h2><p>Small scale and color change on hover.</p><button class="effect-button blue">Explore more</button></article>
        <article class="effect-card"><span class="symbol">♡</span><h2>Connect</h2><p>A shadow and lift effect on hover.</p><button class="effect-button purple">Connect now</button></article>
        <article class="effect-card"><span class="symbol">✓</span><h2>Complete</h2><p>Press the button to see its active state.</p><button class="effect-button green">Mark complete</button></article>
    </main>
    <footer><p>Made with HTML and CSS transitions.</p></footer>
</body>
</html>
