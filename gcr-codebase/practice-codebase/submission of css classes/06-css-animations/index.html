<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <h1>CSS Animation Playground</h1>
        <p>These examples use CSS keyframes—no JavaScript needed.</p>
        <section class="animation-grid">
            <article class="animation-card">
                <h2>Moving Box</h2>
                <div class="track"><div class="moving-box"></div></div>
                <p>Moves from side to side.</p>
            </article>
            <article class="animation-card">
                <h2>Bouncing Ball</h2>
                <div class="ball-area"><div class="ball"></div></div>
                <p>Bounces repeatedly with ease-in-out timing.</p>
            </article>
            <article class="animation-card">
                <h2>Color Text</h2>
                <p class="color-text">CSS is fun!</p>
                <p>Color changes with an alternate direction.</p>
            </article>
        </section>
    </main>
</body>
</html>
