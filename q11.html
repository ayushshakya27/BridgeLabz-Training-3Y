<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>

    <h1>Student Information</h1>

    <form>

        Name:
        <input type="text" required>

        <br><br>

        Roll Number:
        <input type="text" required>

        <br><br>

        Course:

            <option>BCA</option>

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
