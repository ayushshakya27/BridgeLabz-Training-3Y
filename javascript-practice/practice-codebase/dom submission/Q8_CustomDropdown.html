<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Custom Dropdown</title>
<style>
#options { display: none; width: 160px; border: 1px solid #aaa; }
.option { padding: 8px; cursor: pointer; }
.option:hover { background: #eee; }
</style>
</head>
<body>
<h2>Custom Dropdown</h2>
<button id="dropdownButton">Choose an option</button>
<div id="options">
  <div class="option">Apple</div>
  <div class="option">Banana</div>
  <div class="option">Orange</div>
</div>
<script src="Q8_CustomDropdown.js"></script>
</body>
</html>
