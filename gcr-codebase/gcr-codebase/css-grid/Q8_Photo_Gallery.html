<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="Q8_Photo_Gallery.css">
</head>
<body>
  <header><p class="eyebrow">A few places to pause</p><h1>Photo Gallery</h1><p>A collection of scenes that make the world feel a little bigger.</p></header>
  <main class="gallery">
    <figure><div class="photo"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape beneath a wide sky"></div><figcaption>Mountain mornings</figcaption></figure>
    <figure><div class="photo"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Lake surrounded by mountains"></div><figcaption>Still waters</figcaption></figure>
    <figure><div class="photo"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Sunlight filtering through a forest"></div><figcaption>Into the forest</figcaption></figure>
    <figure><div class="photo"><img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=900&q=80" alt="Ocean waves along the shore"></div><figcaption>Ocean rhythm</figcaption></figure>
    <figure><div class="photo"><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=900&q=80" alt="Snowy mountain under a starry sky"></div><figcaption>Under the stars</figcaption></figure>
    <figure><div class="photo"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="Golden sunrise over a field"></div><figcaption>Golden hour</figcaption></figure>
  </main>
</body>
</html>
