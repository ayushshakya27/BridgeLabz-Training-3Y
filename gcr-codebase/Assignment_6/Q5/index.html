<!DOCTYPE html>
<html>
<head>
    <title>Pricing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Pricing Plans</h1>

<div class="pricing">

    <div class="card">
        <h2>Basic</h2>
        <h3>$10</h3>
        <p>5 Projects</p>
        <p>10 GB Storage</p>
        <button>Choose</button>
    </div>

    <div class="card middle">
        <h2>Premium</h2>
        <h3>$25</h3>
        <p>20 Projects</p>
        <p>50 GB Storage</p>
        <button>Choose</button>
    </div>

    <div class="card">
        <h2>Enterprise</h2>
        <h3>$50</h3>
        <p>Unlimited Projects</p>
        <p>100 GB Storage</p>
        <button>Choose</button>
    </div>

</div>

</body>
</html>
