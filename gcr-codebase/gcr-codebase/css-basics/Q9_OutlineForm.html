<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outline and Focus Form</title>
<link rel="stylesheet" href="Q9_OutlineForm.css">
</head>
<body>
<header><h1>Outline and Focus Styling</h1></header>
<main>
<form>
<label for="name">Name</label>
<input id="name" type="text" placeholder="Enter your name">
<label for="email">Email</label>
<input id="email" type="email" placeholder="Enter your email">
<label for="message">Message</label>
<textarea id="message" rows="4" placeholder="Write a message"></textarea>
<button type="submit">Submit</button>
</form>
</main>
<footer>Click an input to see its focus outline.</footer>
</body>
</html>
