<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <h1>Image Filter Gallery</h1>
        <p>Each image starts with a different CSS filter. Hover to see the original.</p>
    </header>
    <main class="gallery">
        <figure class="filter-card">
            <img class="blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Green hills under a cloudy sky">
            <figcaption>Blur</figcaption>
        </figure>
        <figure class="filter-card">
            <img class="grayscale" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Mountain lake">
            <figcaption>Grayscale</figcaption>
        </figure>
        <figure class="filter-card">
            <img class="sepia" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Cabin beside a lake">
            <figcaption>Sepia</figcaption>
        </figure>
        <figure class="filter-card">
            <img class="brightness" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Sunlight through a forest">
            <figcaption>Brightness</figcaption>
        </figure>
        <figure class="filter-card">
            <img class="contrast" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Rocky mountain peaks">
            <figcaption>Contrast</figcaption>
        </figure>
        <figure class="filter-card">
            <img class="hue" src="https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=800&q=80" alt="Coastline and blue water">
            <figcaption>Hue Rotate</figcaption>
        </figure>
    </main>
    <footer><p>CSS filters gallery · Resize the browser to test the layout.</p></footer>
</body>
</html>
