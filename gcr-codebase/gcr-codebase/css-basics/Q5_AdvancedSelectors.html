<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced CSS Selectors</title>
<link rel="stylesheet" href="Q5_AdvancedSelectors.css">
</head>
<body>
<header><h1>Advanced CSS Selectors</h1></header>
<main>
<section class="intro">
<p>This paragraph is inside the intro section.</p>
<p>This is another paragraph.</p>
</section>
<section>
<h2>Item List</h2>
<ul class="items">
<li>First item</li><li>Second item</li><li>Third item</li><li>Fourth item</li>
</ul>
</section>
<section class="links">
<a href="https://example.com">Secure example link</a>
<a href="https://openai.com">Another secure link</a>
</section>
<section>
<label for="sample">Text input:</label>
<input type="text" id="sample" placeholder="Click here">
<input type="email" placeholder="Email input">
</section>
</main>
<footer>Selector Practice</footer>
</body>
</html>
