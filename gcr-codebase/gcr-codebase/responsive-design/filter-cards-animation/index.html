<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Meet the Team</h1><p>Hover over a profile to reveal its original image.</p></header>
    <main class="profiles">
        <article class="profile-card">
            <img class="profile-one" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=80" alt="Portrait of a smiling team member">
            <div class="profile-info"><h2>Maya Singh</h2><p>UI Designer</p></div>
        </article>
        <article class="profile-card">
            <img class="profile-two" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=700&q=80" alt="Portrait of a team member">
            <div class="profile-info"><h2>Arjun Mehta</h2><p>Web Developer</p></div>
        </article>
        <article class="profile-card">
            <img class="profile-three" src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=700&q=80" alt="Portrait of a team member">
            <div class="profile-info"><h2>Sara Khan</h2><p>Project Manager</p></div>
        </article>
    </main>
    <footer><p>Profile card animation using CSS only.</p></footer>
</body>
</html>
