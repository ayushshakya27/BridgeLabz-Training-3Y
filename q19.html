<!DOCTYPE html>
<html>
<head>
    <title>Form Security</title>
</head>
<body>

    <h1>Form Security</h1>

    <form autocomplete="off">

        Name:
        <input type="text" required>

        <br><br>

        Email:
        <input type="email" required>

        <br><br>

        Password:
        <input type="password" required>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <p>
        Turning off autocomplete can improve security by preventing the browser
        from automatically saving and filling sensitive information.
    </p>

</body>
</html>
