<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Transformations</title>
<link rel="stylesheet" href="Q6_Transforms.css">
</head>
<body>
<header><h1>CSS Transformations</h1></header>
<main class="transform-list">
<section><div class="box rotate">Rotate</div><p>rotate(15deg)</p></section>
<section><div class="box scale">Scale</div><p>scale(1.2)</p></section>
<section><div class="box translate">Translate</div><p>translateY(-15px)</p></section>
<section><div class="box skew">Skew</div><p>skew(10deg)</p></section>
</main>
<footer>Hover over each box to see the effect.</footer>
</body>
</html>
