<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Theme Switcher</title>
<style>
body { font-family: Arial; padding: 20px; }
body.light { background: white; color: black; }
body.dark { background: #222; color: white; }
body.blue { background: #dceeff; color: #12345a; }
button { margin: 5px; padding: 8px 12px; }
</style>
</head>
<body data-theme="light" class="light">
<h2>Theme Switcher</h2>
<button data-theme-choice="light">Light</button>
<button data-theme-choice="dark">Dark</button>
<button data-theme-choice="blue">Blue</button>
<script src="Q4_ThemeSwitcher.js"></script>
</body>
</html>
