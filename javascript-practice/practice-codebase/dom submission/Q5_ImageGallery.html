<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Image Gallery</title>
<style>
#gallery { display: grid; grid-template-columns: repeat(3, 130px); gap: 10px; }
#gallery img { width: 130px; height: 100px; object-fit: cover; cursor: pointer; }
#modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); align-items: center; justify-content: center; }
#modal img { max-width: 80%; max-height: 80%; }
</style>
</head>
<body>
<h2>Image Gallery</h2>
<div id="gallery">
  <img src="https://picsum.photos/id/101/400/300" alt="Image 1">
  <img src="https://picsum.photos/id/102/400/300" alt="Image 2">
  <img src="https://picsum.photos/id/103/400/300" alt="Image 3">
  <img src="https://picsum.photos/id/104/400/300" alt="Image 4">
  <img src="https://picsum.photos/id/106/400/300" alt="Image 5">
  <img src="https://picsum.photos/id/107/400/300" alt="Image 6">
</div>
<div id="modal"><img id="largeImage" src="" alt="Preview"></div>
<script src="Q5_ImageGallery.js"></script>
</body>
</html>
