<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header"><a class="logo" href="#">Bright<span>Desk</span></a><nav aria-label="Main navigation"><a href="#form-card">Contact</a><a href="#footer">About</a></nav></header>
    <main class="main-content">
        <section class="content-card" id="form-card">
            <div class="card-image"><img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=900&q=80" alt="Bright modern workspace"></div>
            <div class="card-body">
                <p class="eyebrow">LET'S GET STARTED</p>
                <h1>Make your next idea happen.</h1>
                <p class="intro">Leave your details and we will get in touch with you soon.</p>
                <form action="#" method="get" class="contact-form">
                    <label for="name">Your name</label><input type="text" id="name" name="name" placeholder="Enter your name" required>
                    <label for="email">Email address</label><input type="email" id="email" name="email" placeholder="you@example.com" required>
                    <label for="interest">I'm interested in</label><select id="interest" name="interest"><option>Web design</option><option>Development</option><option>General enquiry</option></select>
                    <div class="form-actions"><button type="submit" class="submit-button">Send enquiry</button><button type="reset" class="reset-button">Clear</button></div>
                </form>
            </div>
        </section>
    </main>
    <footer id="footer"><p>© 2026 BrightDesk · A simple HTML and CSS mini interface</p></footer>
</body>
</html>
