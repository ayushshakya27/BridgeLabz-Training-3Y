<body>

    <p>
        In HTML, we use &lt; and &gt; for angle brackets, 
        &amp; for ampersand, &quot; for double quotes, and 
        &apos; for single quotes. We also use &copy; for copyright, 
        &trade; for trademark, and &reg; for registered trademark.
    </p>
