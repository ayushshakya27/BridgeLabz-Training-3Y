<!DOCTYPE html>
<html>
<head>
    <title>File Upload Form</title>
</head>
<body>

    <h1>File Upload Form</h1>

    
    <form>

        <label>Select File:</label>
        <input type="file" name="image" accept=".jpg, .png" required>

        <br><br>

        <p>Only JPG and PNG image files are allowed.</p>

        <input type="submit" value="Upload">

    </form>

</body>
</html>
