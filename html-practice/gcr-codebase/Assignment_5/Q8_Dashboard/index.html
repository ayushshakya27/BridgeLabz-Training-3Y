<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Dashboard</h1>
    </header>

    <div class="layout">
        <aside>
            <h2>Menu</h2>
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Courses</a>
            <a href="#">Settings</a>
        </aside>

        <main>
            <h2>Welcome, Ayush!</h2>

            <div class="boxes">
                <section class="box">
                    <h3>Courses</h3>
                    <p>You are enrolled in 6 courses this semester.</p>
                </section>

                <section class="box">
                    <h3>Assignments</h3>
                    <p>You have 3 assignments waiting for submission.</p>
                </section>

                <section class="box">
                    <h3>Attendance</h3>
                    <p>Your current attendance is 87%.</p>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
