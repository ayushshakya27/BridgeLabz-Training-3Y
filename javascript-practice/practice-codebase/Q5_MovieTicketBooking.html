<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Movie Ticket Booking</title></head>
<body>
<h2>Movie Ticket Booking</h2>
<form id="bookingForm">
  <label>Name: <input id="name" type="text" required></label><br><br>
  <label>Email: <input id="email" type="email" required></label><br><br>
  <label>Seats (1-10): <input id="seats" type="number" min="1" max="10" required></label><br><br>
  <button type="submit">Book Ticket</button>
</form>
<p id="bookingMessage"></p>
<script src="Q5_MovieTicketBooking.js"></script>
</body>
</html>
