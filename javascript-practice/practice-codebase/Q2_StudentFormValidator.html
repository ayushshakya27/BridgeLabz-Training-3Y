<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Student Form Validator</title></head>
<body>
<h2>Student Registration</h2>
<form id="studentForm">
  <label>Name: <input id="name" type="text"></label><span id="nameError" style="color:red"></span><br><br>
  <label>Email: <input id="email" type="text"></label><span id="emailError" style="color:red"></span><br><br>
  <label>Phone: <input id="phone" type="text"></label><span id="phoneError" style="color:red"></span><br><br>
  <label>Password: <input id="password" type="password"></label><span id="passwordError" style="color:red"></span><br><br>
  <button type="submit">Submit</button>
</form>
<p id="formMessage"></p>
<script src="Q2_StudentFormValidator.js"></script>
</body>
</html>
