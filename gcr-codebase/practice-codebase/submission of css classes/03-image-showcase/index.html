<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Image Showcase</h1><p>A small collection of places to explore</p></header>
    <main class="gallery">
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Green hills under a cloudy sky"></div><figcaption>Green Hills</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Lake surrounded by mountains"></div><figcaption>Mountain Lake</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Cabin near a peaceful lake"></div><figcaption>Quiet Cabin</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Sunlight shining through a forest"></div><figcaption>Forest Walk</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="High rocky mountain peaks"></div><figcaption>Rocky Peaks</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=900&q=80" alt="Coastline with blue water"></div><figcaption>Blue Coast</figcaption></figure>
    </main>
    <footer><p>Images are loaded from Unsplash.</p></footer>
</body>
</html>
