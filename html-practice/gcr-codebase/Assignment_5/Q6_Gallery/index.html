<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Photo Gallery</h1>

    <main class="gallery">
        <figure>
            <img src="gallery1.jpg" alt="Gallery image 1">
            <figcaption>My Profile</figcaption>
        </figure>

        <figure>
            <img src="gallery2.jpg" alt="Gallery image 2">
            <figcaption>Portrait</figcaption>
        </figure>

        <figure>
            <img src="gallery3.jpg" alt="Gallery image 3">
            <figcaption>Campus</figcaption>
        </figure>

        <figure>
            <img src="gallery4.jpg" alt="Gallery image 4">
            <figcaption>Memories</figcaption>
        </figure>

        <figure>
            <img src="gallery5.jpg" alt="Gallery image 5">
            <figcaption>Travel</figcaption>
        </figure>

        <figure>
            <img src="gallery6.jpg" alt="Gallery image 6">
            <figcaption>Favorite Moment</figcaption>
        </figure>
    </main>
</body>
</html>
