<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Components</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="screen">
        <section class="ui-card">
            <div class="brand"><span class="brand-mark">U</span><div><h1>Quick Panel</h1><p>Simple interface components</p></div></div>
            <form class="search-form" action="#" method="get">
                <label for="search">Search items</label>
                <div class="search-row"><input id="search" type="search" name="q" placeholder="Try “design”"><button type="submit">Search</button></div>
            </form>
            <div class="component-group">
                <h2>Quick actions</h2>
                <div class="actions"><button class="action main-action" type="button">Create new</button><button class="action" type="button">View reports</button></div>
            </div>
            <div class="component-group">
                <label for="category">Choose a category</label>
                <select id="category" name="category"><option>General</option><option>Design</option><option>Development</option><option>Support</option></select>
            </div>
            <p class="footnote">Styled with Flexbox, gradients, and CSS pseudo-classes.</p>
        </section>
    </main>
</body>
</html>
