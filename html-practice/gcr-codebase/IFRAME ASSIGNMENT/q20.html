<!DOCTYPE html>
<html>
<head>

    <!-- Title gives the name of the webpage -->
    <title>My Webpage</title>

    <!-- Meta charset sets the character encoding -->
    <meta charset="UTF-8">

    <!-- Meta description describes the webpage -->
    <meta name="description" content="A simple HTML webpage">

    <!-- Meta author shows the name of the author -->
    <meta name="author" content="Ayush Shakya">

    <!-- Base sets the base URL for links -->
    <base href="https://example.com/">

    <!-- Link is used to connect an external resource like a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Style is used to add CSS to the webpage -->
    <style>
    </style>

    <!-- Script is used to add JavaScript to the webpage -->
    <script>
    </script>

</head>
<body>

    <h1>Welcome to My Webpage</h1>

</body>
</html>
