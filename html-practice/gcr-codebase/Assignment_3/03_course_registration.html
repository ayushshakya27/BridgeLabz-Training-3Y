<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration - Ayush Shakya</title>
</head>
<body>
    <header>
        <h1>Course Registration Form</h1>
        <p>GLA University, Mathura</p>
    </header>

    <!-- Fieldset groups the registration information -->
    <form>
        <fieldset>
            <legend>Student Information</legend>

            <p>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" value="Ayush Shakya">
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </p>

            <p>
                <label for="course">Select Course:</label>
                <select id="course" name="course">
                    <option value="web" selected>Web Development</option>
                    <option value="python">Python Programming</option>
                    <option value="database">Database Management</option>
                    <option value="ai">Artificial Intelligence</option>
                </select>
            </p>

            <p>
                <input type="submit" value="Register">
                <input type="reset" value="Reset">
            </p>
        </fieldset>
    </form>

    <!-- Available course schedules -->
    <h2>Available Course Schedules</h2>
    <table border="1">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>10:00 AM - 12:00 PM</td>
            <td>Dr. Sharma</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>11:00 AM - 1:00 PM</td>
            <td>Prof. Verma</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>2:00 PM - 4:00 PM</td>
            <td>Dr. Singh</td>
        </tr>
    </table>
</body>
</html>
