<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>
<body>

    <h1>GLA University Mathura</h1>

    <!-- loading="lazy" makes the map load when it is needed instead of loading immediately -->
    <iframe
        src="https://www.google.com/maps?q=GLA+University+Mathura&output=embed"
        title="Google Map of GLA University Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
