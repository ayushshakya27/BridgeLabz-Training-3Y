<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <h1>Button Collection</h1>
        <p>Try hovering, clicking, or tabbing to each button.</p>
        <section class="button-card" aria-label="Button styles">
            <button class="btn primary">Primary</button>
            <button class="btn secondary">Secondary</button>
            <button class="btn outline">Outline</button>
            <button class="btn disabled" disabled>Disabled</button>
        </section>
        <p class="hint">The disabled button cannot be clicked. Focus the others with the Tab key.</p>
    </main>
</body>
</html>
