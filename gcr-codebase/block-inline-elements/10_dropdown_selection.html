<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection Page</title>
</head>
<body>
    <h1>Travel Selection</h1>

    <!-- Country selection -->
    <label for="country">Country:</label>
    <select id="country" name="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>Australia</option>
    </select>

    <br><br>

    <!-- State selection -->
    <label for="state">State:</label>
    <select id="state" name="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Goa</option>
        <option>Maharashtra</option>
    </select>

    <br><br>

    <!-- City selection -->
    <label for="city">City:</label>
    <select id="city" name="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Jaipur</option>
        <option>Lucknow</option>
    </select>

    <br><br>

    <!-- Tourist place selection -->
    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
        <option selected>Taj Mahal</option>
        <option>Vrindavan</option>
        <option>Amer Fort</option>
        <option>Goa Beaches</option>
    </select>

    <!-- Summary -->
    <p>
        <strong>My Choices:</strong>
        I selected India as my country, Uttar Pradesh as my state,
        Mathura as my city, and the Taj Mahal as my favorite tourist place.
    </p>
</body>
</html>
