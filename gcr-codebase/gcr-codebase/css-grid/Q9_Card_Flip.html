<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Card Flip</title>
  <link rel="stylesheet" href="Q9_Card_Flip.css">
</head>
<body>
  <main class="page">
    <p class="instruction">Hover over the card to flip it</p>
    <div class="card-scene">
      <article class="flip-card">
        <section class="card-face card-front">
          <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Mountain lake landscape">
          <div class="front-copy"><p>EXPLORE</p><h1>Find Your Next Adventure</h1></div>
        </section>
        <section class="card-face card-back">
          <p class="eyebrow">Take the scenic route</p><h2>Adventure awaits</h2><p>Discover new places, enjoy the outdoors, and make time for experiences that stay with you long after the journey ends.</p><a href="#">Learn more</a>
        </section>
      </article>
    </div>
  </main>
</body>
</html>
